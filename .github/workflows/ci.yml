name: ci

on:
  push:
  pull_request:

jobs:
  fast-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI tooling
        run: python -m pip install -r requirements-ci.txt
      - name: Compile and run fast tests
        run: bash scripts/run_tests.sh direct
      - name: Lint
        run: ruff check src tests scripts/run_reduced_e2e.py
      - name: Type check
        run: >
          mypy
          src/lob_forge/protocol.py
          src/lob_forge/holdout.py
          src/lob_forge/execution_sim.py
          src/lob_forge/l2_replay.py
          src/lob_forge/statistics.py
      - name: C++ replay smoke
        run: bash scripts/build_cpp_l2_replay.sh /tmp/l2_replay && /tmp/l2_replay examples/fixtures/l2_replay_fixture.csv >/tmp/l2_replay.out

  model-math-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scikit-learn==1.5.2 xgboost==2.1.3
      - name: Train, freeze, and evaluate both sequence architectures
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_math_remediation.py tests/test_model_audit_regressions.py
