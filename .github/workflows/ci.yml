name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI tooling
        run: python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: >
          mypy
          src/lob_forge/protocol.py
          src/lob_forge/holdout.py
          src/lob_forge/execution_sim.py
          src/lob_forge/l2_replay.py
          src/lob_forge/statistics.py

  public-e2e:
    name: Public E2E (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build, install and verify from exported source
        run: python scripts/run_public_e2e.py --output artifacts/public_e2e/ci
      - name: Retain repeatable E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-e2e-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/public_e2e/ci/
          if-no-files-found: error
          retention-days: 30

  model-math-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify installed package and both CPU sequence architectures
        run: python scripts/run_public_e2e.py --with-models --output artifacts/public_e2e/models
      - name: Retain model E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-e2e-cpu-models
          path: artifacts/public_e2e/models/
          if-no-files-found: error
          retention-days: 30
